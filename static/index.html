<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer vs Help Desk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <section id="controls" class="block">
        <h2 class="block-title">Setup</h2>

        <label class="slider slider-nps">
          <span class="slider-head">
            <span class="slider-label">Customer · NPS</span>
            <output id="nps-value">3</output>
          </span>
          <input id="nps" type="range" min="1" max="10" value="3">
          <span class="slider-scale"><span>hostile</span><span>loyal</span></span>
        </label>

        <label class="slider slider-cx">
          <span class="slider-head">
            <span class="slider-label">Agent · CX</span>
            <output id="cx-value">8</output>
          </span>
          <input id="cx" type="range" min="1" max="10" value="8">
          <span class="slider-scale"><span>incompetent</span><span>exemplary</span></span>
        </label>

        <label class="field">
          <span class="field-label">Scenario</span>
          <select id="scenario"><option value="random">Random</option></select>
        </label>

        <div class="buttons">
          <button id="start" type="button">Start call</button>
          <button id="stop" type="button" disabled>Stop</button>
        </div>
      </section>

      <section class="block library">
        <h2 class="block-title"><span>Recordings</span> <span id="runs-count" class="badge"></span></h2>
        <ul id="runs"></ul>
      </section>
    </aside>

    <div class="main">
      <header class="topbar">
        <p id="run-info" class="run-info"></p>
      </header>

      <p id="error" class="error" hidden></p>

      <div class="grid">
        <section class="panel transcript-panel">
          <h2 class="panel-title"><span>Live transcript</span></h2>
          <ol id="transcript"></ol>
        </section>
        <section class="panel mood-panel">
          <h2 class="panel-title"><span>Customer mood</span> <span id="mood-delta" class="mood-delta"></span></h2>
          <div id="mood"><canvas id="mood-chart"></canvas></div>
        </section>
      </div>

    </div>
  </div>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
